<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>에너지 통계 학습</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#18283e;--blue:#2379d6;--stroke:#dfe7f1}
*{box-sizing:border-box}body{margin:0;background:transparent;padding:14px 10px 28px}button,select{font:inherit}h2{margin:0;font-size:20px}p{line-height:1.5}.card{background:#fff;border:1px solid var(--stroke);border-radius:15px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px #1e35500b}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#697b92;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:16px}.tabs button{border:1px solid #d5e3f4;color:#3a5879;background:#f3f7fc;border-radius:9px;padding:12px 4px;font-weight:700;cursor:pointer}.tabs button.on{background:#216fcc;color:#fff;border-color:#216fcc}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:16px 0}.controls select{background:#fff;color:#263b56;border:1px solid #d8e2ef;border-radius:9px;padding:10px;max-width:100%}.legend{display:flex;gap:7px 16px;flex-wrap:wrap;margin:10px 0 20px;font-size:12px}.legend span{display:inline-flex;align-items:center;gap:5px}.swatch{display:inline-block;width:11px;height:11px;border-radius:3px}.row{display:grid;grid-template-columns:58px minmax(0,1fr) 96px;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #eff2f7}.row:last-child{border-bottom:0}.place{font-weight:700;font-size:13px}.meter{height:22px;width:100%;display:flex;overflow:hidden;background:#eef3f9;border-radius:6px}.seg{height:100%;min-width:0;position:relative;transition:opacity .15s}.seg:hover{opacity:.7}.total{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:#4d5d74}.detail{font-size:11px;color:#6a788b;margin-top:4px;min-height:13px}.hint{font-size:12px;color:#697b92;margin-top:13px}.empty{padding:20px 0;color:#6b788c}.titleLine{font-weight:700;font-size:15px}.stats{font-size:12px;color:#64748b}.number{color:#233955;font-weight:650}@media(max-width:540px){body{padding:9px 4px}.card{padding:13px}.row{grid-template-columns:40px minmax(0,1fr) 74px;gap:6px}.total{font-size:11px}.place{font-size:12px}.tabs button{font-size:12px}.meter{height:20px}}
</style></head><body>
<div class="card"><div class="head"><div><h2>에너지</h2><p class="muted">시도별 에너지 구성비 · 2024년 · 에너지경제연구원 (잠정)</p></div></div><div class="tabs" role="tablist" aria-label="에너지 유형"><button type="button" class="on" data-tab="supply">에너지 공급</button><button type="button" data-tab="production">에너지 생산</button><button type="button" data-tab="renewable">신재생에너지</button></div></div>
<div class="card"><div class="head"><div><div id="chartTitle" class="titleLine"></div><p id="chartSub" class="muted"></p></div></div><div class="controls"><select id="sort" aria-label="정렬 방식"><option value="total">총량 높은 순</option><option value="name">지역 가나다순</option></select><select id="item" aria-label="에너지원 정렬"><option value="">에너지원 비율 비교</option></select></div><div id="legend" class="legend"></div><div id="rows"></div><p id="note" class="hint"></p></div>
<script>
const DATA={"supply":[["충남",59387,44,44,6.5,0,0,5.4],["전남",53598,21.3,45.7,9.3,0.1,18,5.7],["경북",36754,22.2,9.7,6.8,1.1,51.8,8.5],["울산",34934,1.2,65.8,16.5,0,14.4,2.2],["경기",34684,0.6,32.3,59.7,0.7,0,6.7],["인천",22360,23.1,44.5,28.9,0,0,3.4],["경남",16379,56.7,25,9.9,2.1,0,6.3],["부산",12177,0.2,22.9,19.6,0,53.7,3.6],["강원",10655,44.1,19.9,9.6,4.3,0,22.1],["서울",8623,0.1,39.3,54.9,0,0,5.7],["전북",6829,0.1,32.4,16.8,2.7,0,48],["충북",6270,13.3,38.3,23.9,3.6,0,20.9],["대구",3529,4.5,46.9,38.4,0.1,0,10.1],["제주",1996,0,45.5,18.1,0,0,36.4],["광주",1794,0.1,51,38.4,0.1,0,10.4],["대전",1633,0.1,49.1,39.7,0,0,11.1],["세종",1368,0,16.6,73.1,0,0,10.3]],"production":[["경북",22546,0,1.9,84.4,13.8],["전남",12712,0,0.2,75.8,24],["부산",6972,0,0,93.7,6.3],["울산",5779,0,0,86.8,13.2],["전북",3460,0,5.3,0,94.7],["충남",3248,0,0.3,0,99.7],["강원",3066,8.3,14.8,0,76.8],["경기",2562,0,8.9,0,91.1],["충북",1535,0,14.6,0,85.4],["경남",1377,0,25.6,0,74.4],["인천",775,0,0.5,0,99.5],["제주",727,0,0.1,0,99.9],["서울",495,0,0,0,100],["대구",361,0,1.1,0,98.9],["광주",189,0,1.1,0,98.9],["대전",181,0,0,0,100],["세종",141,0,0,0,100]],"renewable":[["전북",3215.5,40.7,0.9,2.3,0,52.6],["충남",2524.6,40.6,0,0.4,0,32.3],["전남",2163.5,77.7,7.1,1.3,0,5.6],["경기",2040,30.7,0,8.7,4.4,25.3],["강원",1948.4,27.5,10.8,12.1,0,23.5],["경북",1662.2,64.1,13.2,4.6,0,7.9],["충북",1060.3,43.8,0,21.2,0,6.9],["경남",1001.7,59.6,3.3,7.9,0,20.6],["제주",698.1,23.2,20.6,0.1,0,53.1]]};
const TYPES={
supply:{title:"1차 에너지 공급",subtitle:"지역별 공급 에너지원 구성 · 단위: 천 toe",names:["석탄","석유","천연가스","수력","원자력","신·재생 등"],colors:["#455f88","#ea9d4f","#62a9d9","#43b6b0","#8868c6","#79b77d"]},
production:{title:"1차 에너지 생산",subtitle:"지역별 국내 생산 에너지원 구성 · 단위: 천 toe",names:["석탄","수력","원자력","신·재생 등"],colors:["#455f88","#43b6b0","#8868c6","#79b77d"]},
renewable:{title:"신재생에너지 생산",subtitle:"지역별 신재생에너지원 구성 · 단위: 천 toe",names:["태양광","풍력","수력","해양","바이오","기타"],colors:["#e9a551","#63a8d6","#4bb9af","#6679c9","#83b879","#bbc4d1"]}
};
let active="supply";const fmt=n=>n.toLocaleString("ko-KR",{maximumFractionDigits:1});
function sourceRows(){return DATA[active].map(r=>{let vals=r.slice(2);if(active==="renewable")vals.push(Math.max(0,Math.round((100-vals.reduce((a,b)=>a+b,0))*10)/10));return {name:r[0],total:r[1],vals}})}
function render(){
 const c=TYPES[active],sort=document.getElementById("sort"),item=document.getElementById("item"),selected=item.value;
 document.getElementById("chartTitle").textContent=c.title;document.getElementById("chartSub").textContent=c.subtitle;
 let rows=sourceRows();if(selected!==""){const idx=Number(selected);rows.sort((a,b)=>b.vals[idx]-a.vals[idx]||b.total-a.total)}else if(sort.value==="name")rows.sort((a,b)=>a.name.localeCompare(b.name,"ko"));else rows.sort((a,b)=>b.total-a.total);
 document.getElementById("legend").innerHTML=c.names.map((name,i)=>'<span><i class="swatch" style="background:'+c.colors[i]+'"></i>'+name+'</span>').join("");
 const el=document.getElementById("rows");el.replaceChildren();rows.forEach(r=>{
  const line=document.createElement("div");line.className="row";const place=document.createElement("span");place.className="place";place.textContent=r.name;const center=document.createElement("div");const bar=document.createElement("div");bar.className="meter";bar.setAttribute("role","img");bar.setAttribute("aria-label",r.name+" "+c.names.map((x,i)=>x+" "+r.vals[i]+"%").join(", "));
  const sum=r.vals.reduce((a,b)=>a+b,0);
  r.vals.forEach((v,i)=>{if(v<=0)return;const seg=document.createElement("div");seg.className="seg";seg.style.width=(v/Math.max(sum,100)*100)+"%";seg.style.background=c.colors[i];seg.title=r.name+" · "+c.names[i]+" "+fmt(v)+"%";bar.appendChild(seg)});
  const detail=document.createElement("div");detail.className="detail";const top=r.vals.map((v,i)=>({v,name:c.names[i]})).sort((a,b)=>b.v-a.v)[0];detail.textContent=top.name+" "+fmt(top.v)+"%";center.append(bar,detail);
  const total=document.createElement("div");total.className="total";total.innerHTML='<span class="number">'+fmt(r.total)+'</span><div class="muted">천 toe</div>';
  line.append(place,center,total);el.appendChild(line);
 });
 document.getElementById("note").textContent=active==="renewable"?"※ 신재생에너지는 제공된 화면에서 확인되는 9개 시도만 표시했습니다. 사진에 생략된 에너지원 비중은 '기타'로 합산하며, 각 수치는 반올림되어 합계가 100%와 조금 다를 수 있습니다.":"※ 사진 속 2024년 잠정 통계 기준. 항목별 구성비는 반올림으로 합계 100%와 약간 다를 수 있습니다. 막대를 누르거나 가리키면 세부 비율을 확인할 수 있습니다.";
}
function refreshItems(){const sel=document.getElementById("item");sel.innerHTML='<option value="">에너지원 비율 비교</option>';TYPES[active].names.forEach((name,i)=>{const op=document.createElement("option");op.value=i;op.textContent=name+" 비중 높은 순";sel.appendChild(op)});}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("sort").value="total";refreshItems();render()}));
document.getElementById("sort").addEventListener("change",()=>{document.getElementById("item").value="";render()});document.getElementById("item").addEventListener("change",render);refreshItems();render();
</script></body></html>
